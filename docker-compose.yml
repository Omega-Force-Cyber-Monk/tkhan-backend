services:
  postgres:
    image: postgres:16-alpine
    container_name: tkhan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tkhan_server
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: softvence/tkhan-backend:latest
    build: .
    container_name: tkhan-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tkhan_server?schema=public
    ports:
      - "3000:3000"

volumes:
  postgres_data:
